version: 2
updates:
  # Keep the GitHub Actions used by our workflows patched (fully supported).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # JS/TS dependency updates. NOTE: this repo uses bun; Dependabot's bun lockfile
  # support is limited, so it reads package.json manifests best-effort. Trivy +
  # `bun audit` remain the primary dependency-vulnerability scanners.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
