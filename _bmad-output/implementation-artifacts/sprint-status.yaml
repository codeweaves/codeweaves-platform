  # ============================================
  # Epic 5: Embeddable Chat Widget ★ NEXT UP
  # Priority: P1
  # Stories: 14
  # Dependencies: Epic 0, Epic 3 (both done)
  # NFRs: NFR4 (<200ms load), NFR10 (<150KB bundle)
  # Research: docs/research-widget-css-isolation.md
  #
  # KEY ARCHITECTURE DECISIONS (from research 2026-03-24):
  #   - Closed Shadow DOM with `all: initial` CSS reset
  #   - Constructable Stylesheets (CSP-safe, no inline <style>)
  #   - CSS custom properties with --cw-* namespace for theming
  #   - Host element: position:fixed, z-index:2147483647, isolation:isolate
  #   - MutationObserver to protect host element from tampering
  #   - Fonts injected into light DOM (@font-face doesn't work in Shadow DOM)
  #   - System font stack as default (zero network cost)
  #   - VisualViewport API for iOS keyboard handling
  #   - 2-phase lazy loading: ~2KB trigger → full widget on click
  #   - No CSS framework — plain CSS inside Shadow DOM
  #
  # IMPLEMENTATION PHASE ORDER:
  #   Phase 1 (Foundation):        5-1 → 5-2 (sequential — 5-2 is THE critical story)
  #   Phase 2 (Init & Theming):    5-3, 5-4, 5-5 (parallel after Phase 1)
